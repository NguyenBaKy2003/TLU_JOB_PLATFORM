version: '3.8'

services:
  # ============================================================
  # REDIS ONLY - Chỉ chạy Redis, app chạy local
  # ============================================================
  redis:
    image: redis:7.2-alpine
    container_name: school-relief-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-Nguyenbaky123}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
    driver: local