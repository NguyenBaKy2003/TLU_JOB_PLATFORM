    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: Asia/Ho_Chi_Minh

  task:
    execution:
      pool:
        core-size: 4
        max-size: 20
        queue-capacity: 100
      thread-name-prefix: jobplatform-async-

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
livekit:
  api-key: devkey # --dev mode dùng key này mặc định
  api-secret: secret # --dev mode dùng secret này mặc định
  url: ws://localhost:7880
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-must-be-at-least-32-chars-long}
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 2592000000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  oauth2:
    authorized-redirect-uris:
      - http://localhost:3000/oauth2/callback
      - http://localhost:3001/oauth2/callback
  mail:
    from: "JobPlatform <noreply@jobplatform.vn>"
