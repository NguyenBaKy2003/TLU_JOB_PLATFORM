<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xml:lang="vi">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <title th:text="${cv.title}">CV</title>
    <style type="text/css">
        @page { size: A4; margin: 0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "DejaVu Sans", sans-serif;
            font-size: 9.5pt;
            color: #2c2c2c;
            line-height: 1.55;
        }

        /* ── Two-column wrapper ── */
        .page    { width: 210mm; min-height: 297mm; display: table; }
        .sidebar {
            display: table-cell;
            width: 68mm;
            background: #1e2a3a;
            color: #dce6f0;
            vertical-align: top;
            padding: 20mm 10mm 20mm 10mm;
        }
        .main {
            display: table-cell;
            vertical-align: top;
            padding: 20mm 14mm 20mm 12mm;
        }

        /* ── Sidebar: Header ── */
        .sb-avatar {
            width: 52mm; height: 52mm;
            border-radius: 50%;
            border: 3px solid #4a9eca;
            margin: 0 auto 10pt auto;
            display: block;
            object-fit: cover;
        }
        .sb-name {
            font-size: 14pt;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            line-height: 1.3;
        }
        .sb-headline {
            font-size: 9pt;
            color: #8ab4cc;
            text-align: center;
            margin-top: 4pt;
            margin-bottom: 14pt;
        }

        /* ── Sidebar: Contact ── */
        .sb-section-title {
            font-size: 8pt;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1pt;
            color: #4a9eca;
            border-bottom: 1px solid #2e4260;
            padding-bottom: 3pt;
            margin-bottom: 7pt;
            margin-top: 14pt;
        }
        .sb-item { font-size: 8.5pt; color: #bdd0e0; margin-bottom: 4pt; }
        .sb-item span { display: block; }

        /* ── Sidebar: Skills ── */
        .sb-skill {
            margin-bottom: 5pt;
            font-size: 8.5pt;
            color: #dce6f0;
        }
        .sb-skill-bar-bg {
            background: #2e4260;
            border-radius: 3pt;
            height: 5pt;
            margin-top: 2pt;
        }
        .sb-skill-bar-fill {
            background: #4a9eca;
            border-radius: 3pt;
            height: 5pt;
        }

        /* ── Main: Section ── */
        .section { margin-bottom: 14pt; }
        .section-title {
            font-size: 12pt;
            font-weight: bold;
            color: #1e2a3a;
            border-left: 4pt solid #4a9eca;
            padding-left: 7pt;
            margin-bottom: 9pt;
        }
        .entry { margin-bottom: 9pt; }
        .entry-row {
            display: table;
            width: 100%;
        }
        .entry-left  { display: table-cell; }
        .entry-right {
            display: table-cell;
            text-align: right;
            font-size: 8.5pt;
            color: #888;
            white-space: nowrap;
        }
        .entry-title { font-weight: bold; font-size: 10pt; }
        .entry-sub   { color: #4a9eca; font-size: 9pt; }
        .entry-desc  { font-size: 9pt; color: #444; margin-top: 3pt; }

        .summary-text { font-size: 9.5pt; color: #333; }
    </style>
</head>
<body>
<div class="page">

    <!-- ── SIDEBAR ────────────────────────────────────────────────── -->
    <div class="sidebar" th:if="${personalInfo != null}">

        <!-- Avatar -->
        <img class="sb-avatar"
             th:if="${personalInfo.avatarUrl}"
             th:src="${personalInfo.avatarUrl}"
             alt="avatar"/>

        <div class="sb-name"     th:text="${personalInfo.fullName}">Họ Tên</div>
        <div class="sb-headline" th:if="${personalInfo.headline}"
             th:text="${personalInfo.headline}">Chức danh</div>

        <!-- Contact -->
        <div class="sb-section-title">Liên hệ</div>
        <div class="sb-item" th:if="${personalInfo.email}">
            <span>✉ <span th:text="${personalInfo.email}"/></span>
        </div>
        <div class="sb-item" th:if="${personalInfo.phone}">
            <span>✆ <span th:text="${personalInfo.phone}"/></span>
        </div>
        <div class="sb-item" th:if="${personalInfo.address}">
            <span>⌂ <span th:text="${personalInfo.address}"/></span>
        </div>
        <div class="sb-item" th:if="${personalInfo.linkedIn}">
            <span>in <span th:text="${personalInfo.linkedIn}"/></span>
        </div>
        <div class="sb-item" th:if="${personalInfo.github}">
            <span>⌥ <span th:text="${personalInfo.github}"/></span>
        </div>

        <!-- Skills (sidebar) -->
        <div th:each="section : ${sections}"
             th:if="${section.type.name() == 'SKILL'}">
            <div class="sb-section-title" th:text="${section.title}">Kỹ năng</div>
            <div th:utext="${section.content}"/>
        </div>

        <!-- Languages (sidebar) -->
        <div th:each="section : ${sections}"
             th:if="${section.type.name() == 'LANGUAGE'}">
            <div class="sb-section-title" th:text="${section.title}">Ngoại ngữ</div>
            <div th:utext="${section.content}"/>
        </div>
    </div>

    <!-- ── MAIN ───────────────────────────────────────────────────── -->
    <div class="main">
        <div th:each="section : ${sections}"
             th:unless="${section.type.name() == 'SKILL' or section.type.name() == 'LANGUAGE'}">
            <div class="section">
                <div class="section-title" th:text="${section.title}">Section</div>
                <div th:if="${section.type.name() == 'SUMMARY'}"
                     class="summary-text" th:utext="${section.content}"/>
                <div th:unless="${section.type.name() == 'SUMMARY'}"
                     th:utext="${section.content}" class="entry-desc"/>
            </div>
        </div>
    </div>

</div>
</body>
</html>
