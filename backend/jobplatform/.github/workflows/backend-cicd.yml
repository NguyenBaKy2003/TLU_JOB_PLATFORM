name: Backend CI/CD → EC2 Dev

on:
  push:
    branches: [develop, main, "feature/**", "sprint/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-cicd.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  IMAGE_NAME: jobplatform-backend
  WORKING_DIR: backend/jobplatform

# ════════════════════════════════════════════════════════════════
jobs:
  # ── Job 1: Build + Test ─────────────────────────────────────────
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/jobplatform

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run tests
        run: ./mvnw test -B --enable-preview
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: backend/jobplatform/target/surefire-reports/
          retention-days: 7

  # ── Job 2: Build Docker Image ───────────────────────────────────
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: ci
    # Chỉ build khi push vào dev hoặc main (không build khi PR)
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: backend/jobplatform

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BRANCH="${GITHUB_REF_NAME}"
          PREFIX=$([ "$BRANCH" = "main" ] && echo "prod" || echo "dev")
          TAG="${PREFIX}-${SHORT_SHA}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG}"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            -f Dockerfile \
            .

      - name: Save Docker image
        run: |
          docker save ${{ env.IMAGE_NAME }}:latest \
            -o /tmp/jobplatform-backend.tar
          ls -lh /tmp/jobplatform-backend.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ steps.meta.outputs.tag }}
          path: /tmp/jobplatform-backend.tar
          retention-days: 1

  # ── Job 3: Deploy Dev ───────────────────────────────────────────
  deploy-dev:
    name: Deploy → Dev EC2
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/develop'
    environment:
      name: development
      url: http://dev-jobplatform.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ needs.build-image.outputs.image-tag }}
          path: /tmp

      # Upload image lên EC2
      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_DEV_USER }}
          key: ${{ secrets.EC2_DEV_SSH_KEY }}
          source: /tmp/jobplatform-backend.tar
          target: /opt/jobplatform/images/

      # Copy docker-compose và nginx config mới nhất
      - name: Copy compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_DEV_USER }}
          key: ${{ secrets.EC2_DEV_SSH_KEY }}
          source: "backend/jobplatform/docker/docker-compose.dev.yml,backend/jobplatform/docker/nginx-dev.conf"
          target: /opt/jobplatform/
          strip_components: 3 # bỏ prefix backend/jobplatform/docker/

      # SSH vào EC2 và deploy
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_DEV_USER }}
          key: ${{ secrets.EC2_DEV_SSH_KEY }}
          script: |
            set -e
            cd /opt/jobplatform

            echo "▶ Load image..."
            docker load -i images/tmp/jobplatform-backend.tar

            echo "▶ Restart backend..."
            docker compose -f docker-compose.dev.yml --env-file .env \
              up -d --no-deps --wait backend

            echo "▶ Health check..."
            sleep 15
            curl -sf http://localhost:8080/actuator/health \
              | grep -q '"status":"UP"' \
              && echo "✅ Healthy" \
              || (echo "❌ Unhealthy" && docker logs jobplatform-backend-dev --tail 50 && exit 1)

            echo "▶ Cleanup old images..."
            docker image prune -f

            echo "🚀 Deploy complete: ${{ needs.build-image.outputs.image-tag }}"
