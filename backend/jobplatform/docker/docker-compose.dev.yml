# docker-compose.dev.yml — Dev EC2
# Chạy: docker compose -f docker-compose.dev.yml --env-file .env up -d
#
# Tất cả services trên 1 EC2 instance (t3.medium đủ dùng cho dev)
# Volumes được mount vào /opt/jobplatform/data/ để data tồn tại qua restart
#
# Lưu ý: Image được pull từ GHCR bởi CI/CD pipeline.
#         EC2 phải đã đăng nhập GHCR trước: docker login ghcr.io

networks:
  jobplatform-net:
    driver: bridge

volumes:
  postgres-data-dev:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/jobplatform/data/postgres
  redis-data-dev:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/jobplatform/data/redis

services:

  # ── PostgreSQL ────
  postgres:
    image: postgres:16-alpine
    container_name: jobplatform-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB:       jobplatform_dev
      POSTGRES_USER:     jobplatform_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    networks:
      - jobplatform-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobplatform_dev -d jobplatform_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"
    # Chỉ mở port ra ngoài khi cần debug — xóa dòng này ở production
    ports:
      - "5432:5432"

  # ── Redis ─────────
  redis:
    image: redis:7-alpine
    container_name: jobplatform-redis-dev
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    volumes:
      - redis-data-dev:/data
    networks:
      - jobplatform-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6379"

  # ── LiveKit ───────────────────────────────────────────────────
  # WebRTC media server — port phải mở thẳng ra ngoài (không qua Nginx)
  # vì UDP không thể proxy qua HTTP reverse proxy.
  #
  # Security Group EC2 cần mở:
  #   TCP 7880  — LiveKit HTTP / WebSocket (Nginx proxy tới đây)
  #   TCP 7881  — LiveKit WebRTC TCP fallback
  #   UDP 50200-50300 — WebRTC media (SRTP/STUN)
  livekit:
    image: livekit/livekit-server:latest
    container_name: jobplatform-livekit-dev
    restart: unless-stopped
    # LiveKit cần biết IP public để điền vào SDP candidate cho client
    # MUST_USE_EXTERNAL_IP=true bảo LiveKit tự detect IP public của EC2
    command: >
      --config /etc/livekit/livekit.yaml
    environment:
      # Không dùng --dev flag trên server thật; dùng config file với key/secret thực
      LIVEKIT_API_KEY:    ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      # HTTP/WS — Nginx sẽ proxy /livekit/* → port này
      - "7880:7880"
      # WebRTC TCP fallback — phải expose thẳng
      - "7881:7881"
      # UDP media range — phải expose thẳng, không qua Nginx
      - "50200-50300:50200-50300/udp"
    networks:
      - jobplatform-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7880/ | grep -q 'livekit' || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Spring Boot Backend ───────────────────────────────────────
  backend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER}/${IMAGE_NAME:-jobplatform-backend}:${IMAGE_TAG:-latest-dev}
    container_name: jobplatform-backend-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE:     dev
      # Database
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/jobplatform_dev
      SPRING_DATASOURCE_USERNAME: jobplatform_dev
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Redis
      SPRING_DATA_REDIS_HOST:     redis
      SPRING_DATA_REDIS_PORT:     6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # JWT
      APP_JWT_SECRET:             ${JWT_SECRET}
      # URLs
      APP_FRONTEND_URL:           ${FRONTEND_URL}
      APP_BASE_URL:               ${APP_BASE_URL}
      CORS_ORIGINS:               ${CORS_ORIGINS}
      # Email
      SPRING_MAIL_USERNAME:       ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD:       ${SPRING_MAIL_PASSWORD}
      # OAuth2
      OAUTH_GOOGLE_CLIENT_ID:       ${OAUTH_GOOGLE_CLIENT_ID}
      OAUTH_GOOGLE_CLIENT_SECRET:   ${OAUTH_GOOGLE_CLIENT_SECRET}
      OAUTH_FACEBOOK_CLIENT_ID:     ${OAUTH_FACEBOOK_CLIENT_ID}
      OAUTH_FACEBOOK_CLIENT_SECRET: ${OAUTH_FACEBOOK_CLIENT_SECRET}
      # LiveKit — backend dùng để tạo token và gọi LiveKit API
      # Trỏ tới service name trong Docker network (không qua Nginx)
      LIVEKIT_URL:        ws://livekit:7880
      LIVEKIT_API_KEY:    ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # Tắt Elasticsearch health check — không có ES trên dev EC2
      MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED: "false"
      SPRING_AUTOCONFIGURE_EXCLUDE: >-
        org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration,
        org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,
        org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
      # JVM — nguồn duy nhất, không định nghĩa lại trong Dockerfile
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:+UseZGC
        -Djava.security.egd=file:/dev/./urandom
        --enable-preview
    expose:
      - "8080"
    networks:
      - jobplatform-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Next.js Frontend ──────────────────────────────────────────
  frontend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER}/${FRONTEND_IMAGE_NAME:-jobplatform-frontend}:${FRONTEND_IMAGE_TAG:-latest-dev}
    container_name: jobplatform-frontend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL:      http://${EC2_IP}/api/v1
      # Client browser kết nối LiveKit qua Nginx WebSocket proxy
      NEXT_PUBLIC_LIVEKIT_URL:  ws://${EC2_IP}/livekit
    expose:
      - "3000"
    networks:
      - jobplatform-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', r => process.exit(r.statusCode >= 500 ? 1 : 0)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Nginx ─────────
  nginx:
    image: nginx:alpine
    container_name: jobplatform-nginx-dev
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - jobplatform-net