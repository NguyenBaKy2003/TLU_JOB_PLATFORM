# docker-compose.dev.yml — Dev EC2
# Chạy: docker compose -f docker-compose.dev.yml --env-file .env up -d
#
# LiveKit: dùng LiveKit Cloud (wss://joblin-x4kf2828.livekit.cloud)
#          → KHÔNG cần container livekit trên EC2
#          → Backend gọi LiveKit API qua internet, browser kết nối thẳng tới Cloud
#
# Tất cả services còn lại trên 1 EC2 instance (t3.medium)
# Volumes mount vào /opt/jobplatform/data/ để data tồn tại qua restart

networks:
  jobplatform-net:
    driver: bridge

volumes:
  postgres-data-dev:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/jobplatform/data/postgres
  redis-data-dev:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/jobplatform/data/redis

services:

  # ── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jobplatform-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB:       jobplatform_dev
      POSTGRES_USER:     jobplatform_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    networks:
      - jobplatform-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobplatform_dev -d jobplatform_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"
    ports:
      - "5432:5432"   # chỉ dùng khi cần debug, xóa ở production

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: jobplatform-redis-dev
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    volumes:
      - redis-data-dev:/data
    networks:
      - jobplatform-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6379"

  # ── Spring Boot Backend ───────────────────────────────────────
  backend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER}/${IMAGE_NAME:-jobplatform-backend}:${IMAGE_TAG:-latest-dev}
    container_name: jobplatform-backend-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE:     dev
      # Database
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/jobplatform_dev
      SPRING_DATASOURCE_USERNAME: jobplatform_dev
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Redis
      SPRING_DATA_REDIS_HOST:     redis
      SPRING_DATA_REDIS_PORT:     6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # JWT
      APP_JWT_SECRET:             ${JWT_SECRET}
      # URLs
      APP_FRONTEND_URL:           ${FRONTEND_URL}
      APP_BASE_URL:               ${APP_BASE_URL}
      CORS_ORIGINS:               ${CORS_ORIGINS}
      # Email
      SPRING_MAIL_USERNAME:       ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD:       ${SPRING_MAIL_PASSWORD}
      # OAuth2
      OAUTH_GOOGLE_CLIENT_ID:       ${OAUTH_GOOGLE_CLIENT_ID}
      OAUTH_GOOGLE_CLIENT_SECRET:   ${OAUTH_GOOGLE_CLIENT_SECRET}
      OAUTH_FACEBOOK_CLIENT_ID:     ${OAUTH_FACEBOOK_CLIENT_ID}
      OAUTH_FACEBOOK_CLIENT_SECRET: ${OAUTH_FACEBOOK_CLIENT_SECRET}
      # LiveKit Cloud — backend dùng để tạo token và gọi LiveKit Server API
      # wss:// vì backend gọi ra internet tới LiveKit Cloud
      LIVEKIT_URL:        ${LIVEKIT_URL}
      LIVEKIT_API_KEY:    ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # Tắt Elasticsearch
      MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED: "false"
      SPRING_AUTOCONFIGURE_EXCLUDE: >-
        org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration,
        org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,
        org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
      # JVM
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:+UseZGC
        -Djava.security.egd=file:/dev/./urandom
        --enable-preview
    expose:
      - "8080"
    networks:
      - jobplatform-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Next.js Frontend ──────────────────────────────────────────
  frontend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER}/${FRONTEND_IMAGE_NAME:-jobplatform-frontend}:${FRONTEND_IMAGE_TAG:-latest-dev}
    container_name: jobplatform-frontend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://${EC2_IP}/api/v1
      # Browser kết nối thẳng tới LiveKit Cloud — không qua EC2
      NEXT_PUBLIC_LIVEKIT_URL: ${LIVEKIT_URL}
    expose:
      - "3000"
    networks:
      - jobplatform-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', r => process.exit(r.statusCode >= 500 ? 1 : 0)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Nginx ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: jobplatform-nginx-dev
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - jobplatform-net