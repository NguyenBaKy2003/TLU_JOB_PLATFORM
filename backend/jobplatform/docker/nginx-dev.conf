# nginx-dev.conf — Dev (HTTP)
# Port 80:
#   /api/*        → backend:8080
#   /livekit/*    → livekit:7880  (WebSocket — cho browser client)
#   /*            → frontend:3000
#
# Lưu ý: UDP media (50200-50300) và TCP fallback (7881) của LiveKit
# KHÔNG đi qua Nginx — chúng được expose thẳng từ docker-compose.

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    # ── API Backend ───────────────────────────────────────────
    location /api/ {
        client_max_body_size 10M;
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Swagger UI
    location /swagger-ui/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Health check backend
    location /health/api {
        proxy_pass  http://backend:8080/actuator/health;
        access_log  off;
    }

    # ── LiveKit WebSocket ─────────────────────────────────────
    # Browser client (livekit-client SDK) kết nối tới đây qua WebSocket.
    # Nginx rewrite /livekit → / trước khi proxy tới LiveKit server.
    #
    # Vì sao cần block riêng:
    #   - LiveKit dùng WebSocket upgrade — cần timeout dài, không buffer
    #   - proxy_read_timeout 3600s để giữ kết nối suốt buổi stream
    location /livekit/ {
        proxy_pass          http://livekit:7880/;
        proxy_http_version  1.1;

        # WebSocket upgrade headers — BẮT BUỘC
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";

        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # Không buffer — stream realtime cần gửi ngay
        proxy_buffering     off;

        # Giữ kết nối WS sống suốt buổi stream (tối đa 1 giờ)
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── Next.js Frontend ──────────────────────────────────────
    location / {
        proxy_pass         http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Next.js static files
    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400, immutable";
        access_log off;
    }
}