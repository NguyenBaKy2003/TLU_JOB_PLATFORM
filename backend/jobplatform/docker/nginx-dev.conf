# nginx-dev.conf — Dev (HTTP only)
# Port 80:
#   /api/*      → backend:8080
#   /*          → frontend:3000
#
# LiveKit: browser kết nối thẳng tới wss://joblin-x4kf2828.livekit.cloud
# → Nginx KHÔNG cần proxy WebSocket LiveKit

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    # ── API Backend ─
    location /api/ {
        client_max_body_size 10M;
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # WebSocket cho STOMP (chat/event realtime qua Spring Boot)
    location /api/v1/ws {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Swagger UI
    location /swagger-ui/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Health check
    location /health/api {
        proxy_pass  http://backend:8080/actuator/health;
        access_log  off;
    }

    # ── Next.js Frontend ──
    location / {
        proxy_pass         http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Next.js static files
    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400, immutable";
        access_log off;
    }
}