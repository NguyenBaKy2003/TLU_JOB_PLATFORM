# docker-compose.prod.yml — Production EC2
# t3.large: 2 vCPU, 8GB RAM
# Postgres + Redis cùng EC2 (tự quản lý)

version: "3.9"

networks:
  jobplatform-net:
    driver: bridge

volumes:
  postgres-data-prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/jobplatform/data/postgres
  redis-data-prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/jobplatform/data/redis

services:
  # ── PostgreSQL ─
  postgres:
    image: postgres:16-alpine
    container_name: jobplatform-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: jobplatform_prod
      POSTGRES_USER: jobplatform_prod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
      # Backup script
      - /opt/jobplatform/scripts/pg-backup.sh:/pg-backup.sh:ro
    networks:
      - jobplatform-net
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobplatform_prod -d jobplatform_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

  # ── Redis ─
  redis:
    image: redis:7-alpine
    container_name: jobplatform-redis-prod
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --appendonly yes
    volumes:
      - redis-data-prod:/data
    networks:
      - jobplatform-net
    deploy:
      resources:
        limits:
          memory: 600M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6379"

  # ── Spring Boot Backend
  backend:
    image: jobplatform-backend:latest
    container_name: jobplatform-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobplatform_prod
      SPRING_DATASOURCE_USERNAME: jobplatform_prod
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_JWT_SECRET: ${JWT_SECRET}
      APP_FRONTEND_URL: ${FRONTEND_URL}
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      APP_OPENAI_API_KEY: ${OPENAI_API_KEY}
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+UseZGC
        -Djava.security.egd=file:/dev/./urandom
        --enable-preview
    ports:
      - "8080:8080"
    networks:
      - jobplatform-net
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    # Graceful shutdown — chờ request hiện tại xử lý xong
    stop_grace_period: 30s

  # ── Nginx (SSL termination) 
  nginx:
    image: nginx:alpine
    container_name: jobplatform-nginx-prod
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL cert từ Let's Encrypt (certbot chạy trên host)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - jobplatform-net
