name: Backend CI/CD → EC2 Dev

on:
  push:
    branches: [develop, main, "feature/**", "sprint/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-cicd.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  # GitHub Container Registry
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/jobplatform-backend

# ════════════════════════════════════════════════════════════════
jobs:
  # ── Job 1: Build + Test ─────────────────────────────────────────
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/jobplatform

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build (skip tests)
        run: ./mvnw package -B -DskipTests

  # ── Job 2: Build & Push Docker Image to GHCR ───────────────────
  build-image:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: ci
    # Chỉ build khi push vào develop hoặc main (không build khi PR)
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: backend/jobplatform

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      full-image: ${{ steps.meta.outputs.full_image }}

    # Cần quyền write packages để push lên GHCR
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BRANCH="${GITHUB_REF_NAME}"
          PREFIX=$([ "$BRANCH" = "main" ] && echo "prod" || echo "dev")
          TAG="${PREFIX}-${SHORT_SHA}"
          FULL_IMAGE="${{ env.IMAGE_NAME }}:${TAG}"
          echo "tag=${TAG}"           >> $GITHUB_OUTPUT
          echo "full_image=${FULL_IMAGE}" >> $GITHUB_OUTPUT
          echo "Image: ${FULL_IMAGE}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # token tự động, không cần tạo secret

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: backend/jobplatform
          file: backend/jobplatform/Dockerfile
          platforms: linux/amd64
          push: true
          # Push 2 tag: tag cụ thể + latest (theo nhánh)
          tags: |
            ${{ steps.meta.outputs.full_image }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name == 'main' && 'latest-prod' || 'latest-dev' }}
          # Cache layer giữa các lần build để tăng tốc
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ── Job 3: Deploy Dev ───────────────────────────────────────────
  deploy-dev:
    name: Deploy → Dev EC2
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/develop'

    environment:
      name: development
      url: http://dev-jobplatform.example.com

    steps:
      - uses: actions/checkout@v4

      # Copy docker-compose và nginx config mới nhất lên EC2
      - name: Copy compose & nginx config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_DEV_USER }}
          key: ${{ secrets.EC2_DEV_SSH_KEY }}
          source: "backend/jobplatform/docker/docker-compose.dev.yml,backend/jobplatform/docker/nginx-dev.conf"
          target: /opt/jobplatform/
          strip_components: 3 # bỏ prefix backend/jobplatform/docker/

      # SSH vào EC2: pull image từ GHCR rồi deploy
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_DEV_USER }}
          key: ${{ secrets.EC2_DEV_SSH_KEY }}
          envs: IMAGE_TAG,FULL_IMAGE,REGISTRY,REPO_OWNER
          script: |
            set -e
            cd /opt/jobplatform

            echo "▶ Log in to GHCR..."
            echo "${{ secrets.GHCR_PAT }}" \
              | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "▶ Pull image: ${{ needs.build-image.outputs.full-image }}..."
            docker pull ${{ needs.build-image.outputs.full-image }}

            echo "▶ Restart backend..."
            BACKEND_IMAGE=${{ needs.build-image.outputs.full-image }} \
            docker compose -f docker-compose.dev.yml --env-file .env \
              up -d --no-deps --wait backend

            echo "▶ Health check..."
            sleep 15
            curl -sf http://localhost:8080/actuator/health \
              | grep -q '"status":"UP"' \
              && echo "✅ Healthy" \
              || (echo "❌ Unhealthy" \
                  && docker logs jobplatform-backend-dev --tail 50 \
                  && exit 1)

            echo "▶ Cleanup dangling images..."
            docker image prune -f

            echo "🚀 Deploy complete: ${{ needs.build-image.outputs.image-tag }}"
