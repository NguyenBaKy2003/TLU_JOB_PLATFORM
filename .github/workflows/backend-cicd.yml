name: CI/CD → EC2 Dev

on:
  push:
    branches: [develop, main, "feature/**", "sprint/**"]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/backend-cicd.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"
      - "frontend/**"

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"

jobs:
  # ════════════════════════════════════════════════════════════════
  #  BACKEND
  # ════════════════════════════════════════════════════════════════

  backend-ci:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/jobplatform

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Fix mvnw line endings and permission
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Build & package
        run: ./mvnw package -B -DskipTests

  backend-build-image:
    name: Backend — Build Docker Image
    runs-on: ubuntu-latest
    needs: backend-ci
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: backend/jobplatform

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          PREFIX=$([ "${GITHUB_REF_NAME}" = "main" ] && echo "prod" || echo "dev")
          TAG="${PREFIX}-${SHORT_SHA}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Fix mvnw line endings and permission
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t jobplatform-backend:${{ steps.meta.outputs.tag }} \
            -t jobplatform-backend:latest \
            -f Dockerfile .

      - name: Save image
        run: |
          docker save jobplatform-backend:latest \
            -o ${{ github.workspace }}/jobplatform-backend.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ steps.meta.outputs.tag }}
          path: ${{ github.workspace }}/jobplatform-backend.tar
          retention-days: 1

  # ════════════════════════════════════════════════════════════════
  #  FRONTEND
  # ════════════════════════════════════════════════════════════════

  frontend-build-image:
    name: Frontend — Build Docker Image
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          PREFIX=$([ "${GITHUB_REF_NAME}" = "main" ] && echo "prod" || echo "dev")
          TAG="${PREFIX}-${SHORT_SHA}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        working-directory: frontend
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL=http://15.135.233.82/api/v1 \
            -t jobplatform-frontend:${{ steps.meta.outputs.tag }} \
            -t jobplatform-frontend:latest \
            -f Dockerfile .

      - name: Save image
        run: |
          docker save jobplatform-frontend:latest \
            -o ${{ github.workspace }}/jobplatform-frontend.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image-${{ steps.meta.outputs.tag }}
          path: ${{ github.workspace }}/jobplatform-frontend.tar
          retention-days: 1

  # ════════════════════════════════════════════════════════════════
  #  DEPLOY
  # ════════════════════════════════════════════════════════════════

  deploy-dev:
    name: Deploy → Dev EC2
    runs-on: ubuntu-latest
    needs: [backend-build-image, frontend-build-image]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: development
      url: http://15.135.233.82

    steps:
      - uses: actions/checkout@v4

      # Download cả 2 images
      - name: Download backend image
        uses: actions/download-artifact@v4
        with:
          name: backend-image-${{ needs.backend-build-image.outputs.image-tag }}
          path: ${{ github.workspace }}

      - name: Download frontend image
        uses: actions/download-artifact@v4
        with:
          name: frontend-image-${{ needs.frontend-build-image.outputs.image-tag }}
          path: ${{ github.workspace }}

      - name: Verify artifacts
        run: ls -lh ${{ github.workspace }}/*.tar

      # Upload backend image
      - name: Copy backend image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_DEV_USER }}
          key: ${{ secrets.EC2_DEV_SSH_KEY }}
          source: jobplatform-backend.tar
          target: /opt/jobplatform/images/

      # Upload frontend image
      - name: Copy frontend image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_DEV_USER }}
          key: ${{ secrets.EC2_DEV_SSH_KEY }}
          source: jobplatform-frontend.tar
          target: /opt/jobplatform/images/

      # Upload docker-compose và nginx config mới nhất
      - name: Copy configs to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_DEV_USER }}
          key: ${{ secrets.EC2_DEV_SSH_KEY }}
          source: "backend/jobplatform/docker/docker-compose.dev.yml,backend/jobplatform/docker/nginx-dev.conf"
          target: /opt/jobplatform/
          strip_components: 3

      # Deploy
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_DEV_USER }}
          key: ${{ secrets.EC2_DEV_SSH_KEY }}
          script: |
            set -e
            cd /opt/jobplatform

            echo "▶ Load backend image..."
            docker load -i images/jobplatform-backend.tar

            echo "▶ Load frontend image..."
            docker load -i images/jobplatform-frontend.tar

            echo "▶ Restart services..."
            docker compose -f docker-compose.dev.yml --env-file .env \
              up -d backend frontend nginx

            echo "▶ Health check backend..."
            sleep 40
            curl -sf http://localhost:8080/actuator/health \
              | grep -q '"status":"UP"' \
              && echo "✅ Backend healthy" \
              || (echo "❌ Backend unhealthy" && docker logs jobplatform-backend-dev --tail 30 && exit 1)

            echo "▶ Health check frontend..."
            curl -sf http://localhost:3000 > /dev/null \
              && echo "✅ Frontend healthy" \
              || echo "⚠️  Frontend not ready yet (normal, keep going)"

            echo "▶ Cleanup..."
            docker image prune -f

            echo "🚀 Deploy complete!"
            echo "   Backend:  http://15.135.233.82/api/v1"
            echo "   Frontend: http://15.135.233.82"
            echo "   Swagger:  http://15.135.233.82/swagger-ui/index.html"
