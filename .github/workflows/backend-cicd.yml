# .github/workflows/backend-cicd.yml
name: Backend CI/CD → EC2 Dev

on:
  push:
    branches: [develop, main, "feature/**", "sprint/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-cicd.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io

jobs:
  # ── Job 1: Build ────────────────────────────────────────────────
  ci:
    name: Build (skip tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/jobplatform

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build (skip tests)
        run: ./mvnw package -B -DskipTests

  # ── Job 2: Build & Push Docker Image ────────────────────────────
  build-image:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: ci
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: backend/jobplatform

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      full-image: ${{ steps.meta.outputs.full_image }}
      image-name: ${{ steps.meta.outputs.image_name }}
      rolling: ${{ steps.meta.outputs.rolling }}
      buildcache: ${{ steps.meta.outputs.buildcache }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BRANCH="${GITHUB_REF_NAME}"
          PREFIX=$([ "$BRANCH" = "main" ] && echo "prod" || echo "dev")
          TAG="${PREFIX}-${SHORT_SHA}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${OWNER}/jobplatform-backend"
          FULL_IMAGE="${IMAGE_NAME}:${TAG}"
          ROLLING_TAG=$([ "$BRANCH" = "main" ] && echo "latest-prod" || echo "latest-dev")
          echo "tag=${TAG}"                           >> $GITHUB_OUTPUT
          echo "full_image=${FULL_IMAGE}"             >> $GITHUB_OUTPUT
          echo "image_name=${IMAGE_NAME}"             >> $GITHUB_OUTPUT
          echo "rolling=${IMAGE_NAME}:${ROLLING_TAG}" >> $GITHUB_OUTPUT
          echo "buildcache=${IMAGE_NAME}:buildcache"  >> $GITHUB_OUTPUT
          echo "Image: ${FULL_IMAGE}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: backend/jobplatform
          file: backend/jobplatform/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.full_image }}
            ${{ steps.meta.outputs.rolling }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.buildcache }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.buildcache }},mode=max

  # ── Job 3: Deploy Dev ───────────────────────────────────────────
  deploy-dev:
    name: Deploy → Dev EC2
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/develop'

    environment:
      name: development
      url: http://dev-jobplatform.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose & nginx config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_DEV_USER }}
          key: ${{ secrets.EC2_DEV_SSH_KEY }}
          source: "backend/jobplatform/docker/docker-compose.dev.yml,backend/jobplatform/docker/nginx-dev.conf"
          target: /opt/jobplatform/
          strip_components: 3

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_DEV_USER }}
          key: ${{ secrets.EC2_DEV_SSH_KEY }}
          envs: LIVEKIT_API_KEY,LIVEKIT_API_SECRET,LIVEKIT_URL
          script: |
            set -e
            cd /opt/jobplatform

            echo "▶ Cập nhật .env với secrets mới nhất..."
            update_env() {
              local key=$1 val=$2
              if grep -q "^${key}=" .env 2>/dev/null; then
                sed -i "s|^${key}=.*|${key}=${val}|" .env
              else
                echo "${key}=${val}" >> .env
              fi
            }
            update_env "LIVEKIT_API_KEY"    "$LIVEKIT_API_KEY"
            update_env "LIVEKIT_API_SECRET" "$LIVEKIT_API_SECRET"
            update_env "LIVEKIT_URL"        "$LIVEKIT_URL"

            echo "▶ Log in to GHCR..."
            echo "${{ secrets.GHCR_PAT }}" \
              | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "▶ Xóa các image backend cũ..."
            docker images --format '{{.Repository}}:{{.Tag}}' \
              | grep 'jobplatform-backend' \
              | grep -v '${{ needs.build-image.outputs.image-tag }}' \
              | grep -v 'latest-dev' \
              | grep -v 'buildcache' \
              | xargs -r docker rmi --force || true

            echo "▶ Pull image: ${{ needs.build-image.outputs.full-image }}..."
            docker pull ${{ needs.build-image.outputs.full-image }}

            echo "▶ Restart backend..."
            IMAGE_TAG=${{ needs.build-image.outputs.image-tag }} \
            docker compose -f docker-compose.dev.yml --env-file .env \
              up -d --no-deps --wait backend

            echo "▶ Health check (tối đa 3 phút)..."
            for i in $(seq 1 18); do
              sleep 10
              STATUS=$(docker exec jobplatform-backend-dev \
                wget -qO- http://localhost:8080/actuator/health 2>/dev/null \
                | grep -o '"status":"[^"]*"' | head -1 || true)
              echo "  attempt ${i}/18: ${STATUS:-no response}"
              if echo "$STATUS" | grep -q '"status":"UP"'; then
                echo "✅ Healthy"
                break
              fi
              if [ "$i" -eq 18 ]; then
                echo "❌ Unhealthy after 3 minutes"
                docker logs jobplatform-backend-dev --tail 80
                exit 1
              fi
            done

            echo "▶ Cleanup dangling images..."
            docker image prune -f

            echo "🚀 Deploy complete: ${{ needs.build-image.outputs.image-tag }}"

        env:
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
