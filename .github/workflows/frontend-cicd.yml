name: Frontend CI/CD → EC2 Dev

on:
  push:
    branches: [develop, main, "feature/**", "sprint/**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-cicd.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "frontend/**"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

# ════════════════════════════════════════════════════════════════
jobs:
  # ── Job 1: Lint & Type Check ────────────────────────────────────
  ci:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (non-blocking)
        run: npm run lint --if-present || true

      - name: Type check (non-blocking)
        run: npm run type-check --if-present || true

  # ── Job 2: Build & Push Docker Image to GHCR ───────────────────
  build-image:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: ci
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      full-image: ${{ steps.meta.outputs.full_image }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BRANCH="${GITHUB_REF_NAME}"
          PREFIX=$([ "$BRANCH" = "main" ] && echo "prod" || echo "dev")
          TAG="${PREFIX}-${SHORT_SHA}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${OWNER}/jobplatform-frontend"
          FULL_IMAGE="${IMAGE_NAME}:${TAG}"
          ROLLING_TAG=$([ "$BRANCH" = "main" ] && echo "latest-prod" || echo "latest-dev")
          echo "tag=${TAG}"                     >> $GITHUB_OUTPUT
          echo "full_image=${FULL_IMAGE}"       >> $GITHUB_OUTPUT
          echo "image_name=${IMAGE_NAME}"       >> $GITHUB_OUTPUT
          echo "rolling=${IMAGE_NAME}:${ROLLING_TAG}" >> $GITHUB_OUTPUT
          echo "buildcache=${IMAGE_NAME}:buildcache"  >> $GITHUB_OUTPUT
          echo "Image: ${FULL_IMAGE}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ secrets.EC2_DEV_HOST }}/api/v1
          tags: |
            ${{ steps.meta.outputs.full_image }}
            ${{ steps.meta.outputs.rolling }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.buildcache }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.buildcache }},mode=max

  # ── Job 3: Deploy Dev ───────────────────────────────────────────
  deploy-dev:
    name: Deploy → Dev EC2
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/develop'

    environment:
      name: development
      url: http://dev-jobplatform.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose & nginx config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_DEV_USER }}
          key: ${{ secrets.EC2_DEV_SSH_KEY }}
          source: "backend/jobplatform/docker/docker-compose.dev.yml,backend/jobplatform/docker/nginx-dev.conf"
          target: /opt/jobplatform/
          strip_components: 3

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_DEV_USER }}
          key: ${{ secrets.EC2_DEV_SSH_KEY }}
          script: |
            set -e
            cd /opt/jobplatform

            echo "▶ Log in to GHCR..."
            echo "${{ secrets.GHCR_PAT }}" \
              | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "▶ Pull image: ${{ needs.build-image.outputs.full-image }}..."
            docker pull ${{ needs.build-image.outputs.full-image }}

            echo "▶ Tag as local latest for compose..."
            docker tag ${{ needs.build-image.outputs.full-image }} \
              jobplatform-frontend:latest

            echo "▶ Restart frontend..."
            FRONTEND_IMAGE_TAG=${{ needs.build-image.outputs.image-tag }} \
            docker compose -f docker-compose.dev.yml --env-file .env \
              up -d --no-deps --wait frontend

            echo "▶ Health check..."
            sleep 10
            curl -sfL http://localhost:3000 \
              && echo "✅ Frontend healthy" \
              || (echo "❌ Frontend unhealthy" \
                  && docker logs jobplatform-frontend-dev --tail 50 \
                  && exit 1)

            echo "▶ Reload nginx..."
            docker exec jobplatform-nginx-dev nginx -s reload

            echo "▶ Cleanup dangling images..."
            docker image prune -f

            echo "🚀 Deploy complete: ${{ needs.build-image.outputs.image-tag }}"
